<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;min-height:100%;background:#000;overflow:hidden;font-family:sans-serif;color:#fff}
#p{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;border:0;overflow:hidden}
#p iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important}
body.custom #p{pointer-events:none}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;display:none}
body.custom #ui{display:block}
#tap{position:absolute;top:0;left:0;right:0;bottom:0}
#spin{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border:4px solid rgba(255,255,255,.2);border-top-color:#d4af37;border-radius:50%;animation:sp .8s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
#big{position:absolute;top:50%;left:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:rgba(15,40,30,.55);border:2px solid #d4af37;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;transition:opacity .25s,transform .2s}
#big:active{transform:scale(.92)}
#big svg{width:34px;height:34px;fill:#fff}
#bar{position:absolute;left:0;right:0;bottom:0;padding:34px 26px 16px;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,0));transition:opacity .25s;direction:ltr}
#row1{display:flex;align-items:center;gap:12px}
.t{font-size:13px;font-weight:600;min-width:46px;text-align:center;color:#f3e7b3;font-variant-numeric:tabular-nums}
#track{position:relative;flex:1;height:34px;display:flex;align-items:center;touch-action:none}
#rail{position:relative;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
#buf{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:rgba(255,255,255,.35);width:0}
#fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:linear-gradient(90deg,#1f8a5b,#d4af37);width:0}
#knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(212,175,55,.35);left:0}
#row2{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.b{min-width:46px;height:42px;padding:0 12px;border-radius:21px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(6px)}
.b:active{background:rgba(212,175,55,.45)}
.b svg{width:20px;height:20px;fill:#fff}
#vol{width:90px;accent-color:#d4af37;height:30px}
#hint{position:absolute;top:50%;font-size:20px;font-weight:700;padding:10px 18px;border-radius:30px;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.hide #bar,.hide #big{opacity:0;pointer-events:none}
</style></head><body class="%CLASS%">
<div id="p"></div>
<div id="ui" class="">
 <div id="tap"></div>
 <div id="spin"></div>
 <div id="hint"></div>
 <div id="big"><svg viewBox="0 0 24 24" id="bigico"><path d="M8 5v14l11-7z"/></svg></div>
 <div id="bar">
  <div id="row1"><span class="t" id="cur">0:00</span>
   <div id="track"><div id="rail"><div id="buf"></div><div id="fill"></div><div id="knob"></div></div></div>
   <span class="t" id="dur">0:00</span></div>
  <div id="row2">
   <div class="b" id="spd">1x</div>
   <div class="b" id="back">&#8634; 10</div>
   <div class="b" id="pp"><svg viewBox="0 0 24 24" id="ppico"><path d="M8 5v14l11-7z"/></svg></div>
   <div class="b" id="fwd">10 &#8635;</div>
   <div class="b" id="mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></div>
   <input id="vol" type="range" min="0" max="100" value="50">
  </div>
 </div>
</div>
<script>
var player,custom=%CUSTOM%,PLAY='M8 5v14l11-7z',PAUSE='M6 5h4v14H6zm8 0h4v14h-4z',REPLAY='M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z';
function $(i){return document.getElementById(i);}
function fmt(x){x=Math.floor(x||0);var h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s;}
function ico(p){$('ppico').firstChild.setAttribute('d',p);$('bigico').firstChild.setAttribute('d',p);}
var hideT=null,state=-1,drag=false,rates=[1,1.25,1.5,2,0.75],ri=0;
function show(){document.getElementById('ui').classList.remove('hide');clearTimeout(hideT);if(state===1&&!drag){hideT=setTimeout(function(){$('ui').classList.add('hide');},3500);}}
function hint(t,x){var h=$('hint');h.textContent=t;h.style.left=x;h.style.opacity=1;setTimeout(function(){h.style.opacity=0;},650);}
function seekBy(d){try{var t=Math.max(0,player.getCurrentTime()+d);player.seekTo(t,true);}catch(e){}}
function toggle(){try{if(state===1)player.pauseVideo();else if(state===0){player.seekTo(0,true);player.playVideo();}else player.playVideo();}catch(e){}}
function disableCaptions(){
 try{if(player&&typeof player.setOption==='function'){
  try{player.setOption('captions','track',{});}catch(e){}
  try{player.setOption('cc','track',{});}catch(e){}
 }}catch(e){}
}
function onYouTubeIframeAPIReady(){
 player=new YT.Player('p',{videoId:'%VID%',playerVars:{autoplay:1,controls:custom?0:1,fs:custom?0:1,rel:0,playsinline:1,modestbranding:1,iv_load_policy:3,cc_load_policy:0,disablekb:1,enablejsapi:1,origin:'https://www.youtube.com',start:%START%},events:{
  onReady:function(){
  disableCaptions();
  // يكرر الإيقاف لأن وحدة الترجمة قد تُحمّل بعد جاهزية المشغّل.
  var tries=0,ct=setInterval(function(){disableCaptions();if(++tries>=12)clearInterval(ct);},500);
  try{player.setVolume(50);player.unMute();player.playVideo();}catch(e){}
 },
 onApiChange:function(){disableCaptions();},

  onStateChange:function(e){state=e.data;disableCaptions();clearTimeout(window.__st);
   $('spin').style.display=(state===3)?'block':'none';
   if(state===3){window.__st=setTimeout(function(){try{LecBridge.stalled(Math.floor(player.getCurrentTime()));}catch(x){}},15000);}
   if(state===1){try{player.setVolume(+$('vol').value);}catch(x){}LecBridge.playing();ico(PAUSE);show();}
   else if(state===0){ico(REPLAY);show();}
   else if(state===2){ico(PLAY);show();}},
  onError:function(e){try{LecBridge.embedFailed(+e.data||0);}catch(x){}}}});}
var api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';document.head.appendChild(api);
if(custom){
 var last=0;
 $('tap').addEventListener('click',function(e){var now=Date.now(),w=window.innerWidth,x=e.clientX;
  if(now-last<320&&(x<w*0.35||x>w*0.65)){if(x<w*0.35){seekBy(-10);hint('-10',(w*0.18)+'px');}else{seekBy(10);hint('+10',(w*0.78)+'px');}last=0;show();return;}
  last=now;var hid=$('ui').classList.contains('hide');if(hid)show();else{$('ui').classList.add('hide');}});
 $('big').addEventListener('click',function(){toggle();show();});
 $('pp').addEventListener('click',function(){toggle();show();});
 $('back').addEventListener('click',function(){seekBy(-10);show();});
 $('fwd').addEventListener('click',function(){seekBy(10);show();});
 $('spd').addEventListener('click',function(){ri=(ri+1)%rates.length;try{player.setPlaybackRate(rates[ri]);}catch(e){}$('spd').textContent=rates[ri]+'x';show();});
 $('vol').addEventListener('input',function(){try{player.setVolume(+$('vol').value);if(+$('vol').value>0)player.unMute();}catch(e){}show();});
 $('mute').addEventListener('click',function(){try{if(player.isMuted()){player.unMute();}else{player.mute();}}catch(e){}show();});
 var tr=$('track');
 function seekTo(ev){var r=$('rail').getBoundingClientRect();var f=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
  $('fill').style.width=(f*100)+'%';$('knob').style.left=(f*100)+'%';
  try{var d=player.getDuration();$('cur').textContent=fmt(f*d);return f*d;}catch(e){return 0;}}
 tr.addEventListener('pointerdown',function(ev){drag=true;tr.setPointerCapture(ev.pointerId);seekTo(ev);show();});
 tr.addEventListener('pointermove',function(ev){if(drag)seekTo(ev);});
 function endDrag(ev){if(!drag)return;var t=seekTo(ev);drag=false;try{player.seekTo(t,true);}catch(e){}show();}
 tr.addEventListener('pointerup',endDrag);tr.addEventListener('pointercancel',function(){drag=false;});
 setInterval(function(){try{if(!player||!player.getDuration||drag)return;var d=player.getDuration()||0,c=player.getCurrentTime()||0;
  if(d>0){var f=c/d*100;$('fill').style.width=f+'%';$('knob').style.left=f+'%';$('buf').style.width=(player.getVideoLoadedFraction()*100)+'%';}
  $('cur').textContent=fmt(c);$('dur').textContent=fmt(d);}catch(e){}},300);
}
setInterval(function(){try{if(state===1&&player&&player.getCurrentTime){LecBridge.progress(Math.floor(player.getCurrentTime()),Math.floor(player.getDuration()||0));}}catch(e){}},3000);
%ADJS%
</script></body></html>
