plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    // Release signing: keep keystore.properties and app/rafeeq-release.jks safe.
    def signingPropsFile = rootProject.file("keystore.properties")
    def signingProps = new Properties()
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }

    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    namespace 'com.raad.monasabatna'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raad.monasabatna'
        minSdk 23
        targetSdk 35
        versionCode 43
        versionName '3.34'
    }
    buildTypes {
        release {
            // Keep code shrinking disabled to avoid breaking existing WebView/JavaScript features.
            minifyEnabled false
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Serves bundled assets through a secure HTTPS origin so WebView interception works reliably.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.12.0'
}


// After assembleRelease, copy the signed APK to the phone's Download folder so it is easy to find and install.
afterEvaluate {
    tasks.named('assembleRelease') {
        doLast {
            try {
                def apkDir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
                def apks = apkDir.listFiles({ f -> f.name.endsWith('.apk') } as FileFilter)
                if (apks != null && apks.length > 0) {
                    def target = new File('/storage/emulated/0/Download/RafeeqAlMuslim-release.apk')
                    java.nio.file.Files.copy(apks[0].toPath(), target.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    println "APK copied to: ${target.absolutePath}"
                } else {
                    println "APK not found in: ${apkDir}"
                }
            } catch (Throwable t) {
                println "Could not copy APK: ${t}"
            }
        }
    }
}
